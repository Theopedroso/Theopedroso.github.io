<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guia Tatuí — Empresas locais</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <h1>Guia Tatuí</h1>
    <p>Encontre restaurantes, bares, farmácias e outras empresas da região</p>
  </header>

  <main>
    <div class="filters">
      <input type="text" id="search-input" placeholder="Buscar por nome..." />
      <select id="category-select">
        <option value="">Todas as categorias</option>
      </select>
    </div>

    <div class="results-header">
      <span id="results-count"></span>
    </div>

    <p id="status-message"></p>
    <div class="grid" id="results-grid"></div>
  </main>

  <footer>
    <p>Dados públicos de CNPJ (Receita Federal) — Tatuí/SP</p>
    <p><a href="owner.html">Tem uma empresa aqui? Reivindique seu anúncio</a></p>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
